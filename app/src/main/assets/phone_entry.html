<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:,">
<title>SwitchGuard</title>
<style>
  :root { --bg:#f6f8f8; --card:#fff; --text:#14201f; --muted:#5b6b69; --line:#d5dddc; --accent:#0f7b70; --onaccent:#fff; --err:#b3261e; --ok:#1b6e3a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1514; --card:#18201f; --text:#e3ebea; --muted:#9aaba9; --line:#2c3836; --accent:#5fd3c4; --onaccent:#00201c; --err:#ffb4ab; --ok:#8fd8a6; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width:520px; margin:0 auto; padding:24px 16px 40px; }
  .brand { font-weight:700; letter-spacing:.2px; color:var(--accent); font-size:15px; }
  h1 { font-size:22px; margin:6px 0 4px; }
  p.lead { color:var(--muted); margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:18px; }
  label { display:block; font-weight:600; margin:14px 0 6px; }
  label:first-child { margin-top:0; }
  input { width:100%; min-width:0; padding:14px; font:16px ui-monospace, Menlo, Consolas, monospace; color:var(--text); background:var(--bg);
          border:1px solid var(--line); border-radius:12px; }
  input:focus { outline:2px solid var(--accent); border-color:transparent; }
  .row { display:flex; gap:8px; }
  .row input { flex:1; }
  .paste { flex:none; padding:0 14px; border-radius:12px; border:1px solid var(--line); background:transparent; color:var(--accent); font:600 14px system-ui, sans-serif; }
  button.send { width:100%; margin-top:22px; padding:16px; border:0; border-radius:999px; background:var(--accent); color:var(--onaccent); font:700 17px system-ui, sans-serif; }
  button:disabled { opacity:.55; }
  .msg { margin-top:16px; min-height:1.4em; }
  .msg.err { color:var(--err); }
  .done { text-align:center; padding:28px 8px; }
  .done .tick { font-size:48px; color:var(--ok); }
  .note { color:var(--muted); font-size:13px; margin-top:18px; }
</style>
</head>
<body>
<main id="app"></main>
<script>
var CONFIG = /*CONFIG*/null;
(function () {
  "use strict";
  var K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,
    0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,
    0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,
    0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];

  // SHA-256 (FIPS 180-4). Düz HTTP sayfasında tarayıcının crypto.subtle arayüzü yok (yalnızca HTTPS'te var).
  function sha256(bytes) {
    var H = new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]);
    var len = bytes.length, n = ((len + 9 + 63) >> 6) << 6, m = new Uint8Array(n);
    m.set(bytes); m[len] = 0x80;
    var dv = new DataView(m.buffer);
    dv.setUint32(n - 4, (len * 8) >>> 0); dv.setUint32(n - 8, Math.floor(len / 0x20000000));
    var w = new Uint32Array(64);
    for (var i = 0; i < n; i += 64) {
      for (var t = 0; t < 16; t++) w[t] = dv.getUint32(i + t * 4);
      for (t = 16; t < 64; t++) {
        var x = w[t - 15], y = w[t - 2];
        var s0 = ((x >>> 7) | (x << 25)) ^ ((x >>> 18) | (x << 14)) ^ (x >>> 3);
        var s1 = ((y >>> 17) | (y << 15)) ^ ((y >>> 19) | (y << 13)) ^ (y >>> 10);
        w[t] = (w[t - 16] + s0 + w[t - 7] + s1) | 0;
      }
      var a = H[0], b = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
      for (t = 0; t < 64; t++) {
        var S1 = ((e >>> 6) | (e << 26)) ^ ((e >>> 11) | (e << 21)) ^ ((e >>> 25) | (e << 7));
        var ch = (e & f) ^ (~e & g);
        var t1 = (h + S1 + ch + K[t] + w[t]) | 0;
        var S0 = ((a >>> 2) | (a << 30)) ^ ((a >>> 13) | (a << 19)) ^ ((a >>> 22) | (a << 10));
        var mj = (a & b) ^ (a & c) ^ (b & c);
        h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + S0 + mj) | 0;
      }
      H[0] += a; H[1] += b; H[2] += c; H[3] += d; H[4] += e; H[5] += f; H[6] += g; H[7] += h;
    }
    var out = new Uint8Array(32), ov = new DataView(out.buffer);
    for (i = 0; i < 8; i++) ov.setUint32(i * 4, H[i]);
    return out;
  }
  function concat() {
    var total = 0, i;
    for (i = 0; i < arguments.length; i++) total += arguments[i].length;
    var out = new Uint8Array(total), pos = 0;
    for (i = 0; i < arguments.length; i++) { out.set(arguments[i], pos); pos += arguments[i].length; }
    return out;
  }
  function hmac(key, data) {
    var k = new Uint8Array(64); k.set(key.length > 64 ? sha256(key) : key);
    var ipad = new Uint8Array(64), opad = new Uint8Array(64);
    for (var i = 0; i < 64; i++) { ipad[i] = k[i] ^ 0x36; opad[i] = k[i] ^ 0x5c; }
    return sha256(concat(opad, sha256(concat(ipad, data))));
  }
  function utf8(s) { return new TextEncoder().encode(s); }
  function b64url(bytes) {
    var s = ""; for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  function unb64url(s) {
    s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "=";
    var bin = atob(s), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  // Anahtar akışı = SHA-256(encKey ‖ nonce ‖ sayaç); bütünlük = HMAC-SHA256(macKey, nonce ‖ şifreli). Bkz. PhoneEntry.kt.
  function seal(key, nonce, plain) {
    var encKey = sha256(concat(key, utf8("enc"))), macKey = sha256(concat(key, utf8("mac")));
    var cipher = new Uint8Array(plain.length);
    for (var pos = 0, counter = 0; pos < plain.length; counter++) {
      var ctr = new Uint8Array([counter >>> 24 & 255, counter >>> 16 & 255, counter >>> 8 & 255, counter & 255]);
      var block = sha256(concat(encKey, nonce, ctr));
      for (var j = 0; j < 32 && pos < plain.length; j++, pos++) cipher[pos] = plain[pos] ^ block[j];
    }
    return { n: b64url(nonce), c: b64url(cipher), t: b64url(hmac(macKey, concat(nonce, cipher))) };
  }
  // Testlerde (node) yalnızca şifreleme kullanılır.
  if (typeof module !== "undefined") { module.exports = { sha256: sha256, hmac: hmac, seal: seal, b64url: b64url, unb64url: unb64url, utf8: utf8 }; return; }

  var cfg = CONFIG, s = cfg.s, app = document.getElementById("app");
  document.documentElement.lang = s.lang || "en";
  function el(tag, attrs, text) {
    var e = document.createElement(tag);
    for (var k in attrs || {}) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    return e;
  }
  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }
  var key = location.hash.length > 1 ? unb64url(location.hash.slice(1)) : null;
  app.appendChild(el("div", { "class": "brand" }, "SwitchGuard"));
  app.appendChild(el("h1", null, cfg.title));
  app.appendChild(el("p", { "class": "lead" }, s.lead));
  var card = el("div", { "class": "card" });
  app.appendChild(card);
  if (!key || key.length !== 32) { card.appendChild(el("p", { "class": "msg err" }, s.badLink)); return; }

  var inputs = {};
  cfg.fields.forEach(function (f) {
    var id = "f_" + f.k;
    card.appendChild(el("label", { "for": id }, f.label));
    var row = el("div", { "class": "row" });
    var input = el("input", { id: id, type: "text", autocomplete: "off", autocapitalize: "off", autocorrect: "off", spellcheck: "false" });
    input.value = f.value || "";
    inputs[f.k] = input;
    row.appendChild(input);
    if (navigator.clipboard && navigator.clipboard.readText) {
      var paste = el("button", { type: "button", "class": "paste" }, s.paste);
      paste.onclick = function () { navigator.clipboard.readText().then(function (t) { input.value = t.trim(); }, function () {}); };
      row.appendChild(paste);
    }
    card.appendChild(row);
  });
  var send = el("button", { type: "button", "class": "send" }, s.send);
  var msg = el("div", { "class": "msg" });
  card.appendChild(send); card.appendChild(msg);
  app.appendChild(el("p", { "class": "note" }, s.note));

  send.onclick = function () {
    var values = {}, empty = true;
    Object.keys(inputs).forEach(function (k) { values[k] = inputs[k].value.trim(); if (values[k]) empty = false; });
    if (empty) { msg.className = "msg err"; msg.textContent = s.empty; return; }
    var nonce = new Uint8Array(16); crypto.getRandomValues(nonce);
    send.disabled = true; msg.className = "msg"; msg.textContent = s.sending;
    fetch(location.pathname, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(seal(key, nonce, utf8(JSON.stringify(values)))) })
      .then(function (r) { return r.json().catch(function () { return { ok: false }; }); })
      .then(function (r) {
        if (!r.ok) throw new Error();
        clear(card);
        var done = el("div", { "class": "done" });
        done.appendChild(el("div", { "class": "tick" }, "✓"));
        done.appendChild(el("h1", null, s.sent));
        done.appendChild(el("p", { "class": "lead" }, s.sentBody));
        card.appendChild(done);
      })
      .catch(function () { send.disabled = false; msg.className = "msg err"; msg.textContent = s.failed; });
  };
})();
</script>
</body>
</html>
